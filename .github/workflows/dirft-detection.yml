# .github/workflows/drift-detection.yml - Infrastructure Drift Detection
#
# Runs on a weekly schedule to detect configuration drift - differences
# between the Terraform state and the actual Azure infrastructure.
#
# Drift can occur when:
#   - Someone makes manual changes in the Azure portal
#   - Another tool or script modifies resources
#   - Azure applies automatic updates or policy remediations
#
# This workflow runs 'terraform plan' and creates a GitHub Issue if
# any drift is detected.

name: "Drift Detection"

on:
  schedule:
    # Run every Monday at 6:00 AM UTC
    - cron: "0 6 * * 1"
  # Allow manual trigger for ad-hoc drift checks
  workflow_dispatch:

permissions:
  id-token: write      # Required for OIDC authentication
  contents: read       # Required to checkout the repository
  issues: write        # Required to create drift issues

env:
  TF_VERSION: "1.9.0"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: "true"

jobs:
  drift-check:
    name: "Check for Drift"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan (drift detection)
        id: plan
        run: terraform plan -detailed-exitcode -input=false
        continue-on-error: true

      # Exit code 2 = changes detected (drift)
      - name: Create drift issue
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const planOutput = process.env.PLAN_OUTPUT || 'No plan output captured.';

            // Truncate if needed
            const maxLength = 60000;
            let body = planOutput;
            if (body.length > maxLength) {
              body = body.substring(0, maxLength) + '\n\n... (truncated)';
            }

            const issueTitle = `Infrastructure Drift Detected - ${new Date().toISOString().split('T')[0]}`;

            const issueBody = `## :warning: Infrastructure Drift Detected

            Terraform detected differences between the desired state and actual infrastructure.
            This may indicate manual changes were made outside of Terraform.

            ### Action Required
            1. Review the plan output below
            2. If the changes are intentional, update the Terraform code to match
            3. If the changes are unintentional, run \`terraform apply\` to remediate

            <details><summary>Terraform Plan Output</summary>

            \`\`\`hcl
            ${body}
            \`\`\`

            </details>

            *Detected by [drift-detection workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['infrastructure', 'drift', 'needs-review']
            });

      - name: Report no drift
        if: steps.plan.outputs.exitcode == '0'
        run: echo "No drift detected. Infrastructure matches Terraform state."

      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "::error::Terraform plan failed. Check the logs for details."
          exit 1
