name: 'Terraform Plan/Apply'

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

# Required for OIDC authentication to Azure
permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  ARM_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
  ARM_SUBSCRIPTION_ID: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
  ARM_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
  TF_VERSION: "1.9.0"

jobs:
  # ---------- PLAN ----------
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        environment: [dev, prod]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: cicd-terraform-environment/environments/${{ matrix.environment }}
        continue-on-error: true

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=stterraformstate83417ead" \
            -backend-config="storage_account_name=stterraformstate83417ead" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ matrix.environment }}.tfstate"
        working-directory: cicd-terraform-environment/environments/${{ matrix.environment }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: cicd-terraform-environment/environments/${{ matrix.environment }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan
        working-directory: cicd-terraform-environment/environments/${{ matrix.environment }}
        continue-on-error: true

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planFile = 'cicd-terraform-environment/environments/${{ matrix.environment }}/tfplan';
            
            if (fs.existsSync(planFile)) {
              const { exec } = require('child_process');
              exec(`cd cicd-terraform-environment/environments/${{ matrix.environment }} && terraform show -no-color tfplan`, (error, stdout) => {
                const plan = stdout.toString();
                
                const comment = `## Terraform Plan - ${{ matrix.environment }}
                
\`\`\`
${plan}
\`\`\`
                
**Status:** ${{ steps.plan.outcome }}`;

                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              });
            }

  # ---------- APPLY ----------
  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    strategy:
      matrix:
        environment: [dev, prod]
    
    environment:
      name: ${{ matrix.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=stterraformstate83417ead" \
            -backend-config="storage_account_name=stterraformstate83417ead" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ matrix.environment }}.tfstate"
        working-directory: cicd-terraform-environment/environments/${{ matrix.environment }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: cicd-terraform-environment/environments/${{ matrix.environment }}

      - name: Upload Outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ matrix.environment }}
          path: cicd-terraform-environment/environments/${{ matrix.environment }}/

      - name: Terraform Outputs
        run: terraform output -no-color
        working-directory: cicd-terraform-environment/environments/${{ matrix.environment }}
